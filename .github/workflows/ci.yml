name: RAG API CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build knowledge base
        run: python build_knowledge_base.py

      - name: Start FastAPI server
        env:
          USE_MOCK_LLM: "1"
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          sleep 5
          cat server.log

      - name: Check API
        run: |
          curl -X POST "http://127.0.0.1:8000/query?q=What%20is%20Kubernetes%3F"

      - name: Run semantic tests
        env:
          USE_MOCK_LLM: "1"
        run: python semantic_test.py